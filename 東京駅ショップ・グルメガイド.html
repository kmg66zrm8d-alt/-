<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東京駅 ショップ・グルメガイド</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap');
:root{--ink:#182631;--navy:#102f46;--navy2:#1b506d;--brick:#9b4038;--brick2:#c16b5c;--gold:#b19358;--cream:#f5f0e8;--paper:#f6f7f6;--white:#fff;--line:#dfe4e5;--muted:#74818a;--shadow:0 12px 35px rgba(16,47,70,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;letter-spacing:.015em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 8% 10%,rgba(155,64,56,.06),transparent 25%),radial-gradient(circle at 92% 30%,rgba(177,147,88,.06),transparent 28%)}
.top{height:5px;background:linear-gradient(90deg,var(--brick) 0 19%,var(--navy) 19% 82%,var(--gold) 82% 100%)}

header{background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.head{max-width:1180px;margin:auto;padding:16px 22px 13px;display:flex;align-items:flex-end;justify-content:space-between}
.brand small{display:inline-block;font-size:9px;letter-spacing:.25em;color:var(--brick);font-weight:800;border-left:3px solid var(--brick);padding-left:9px}
.brand h1{margin:6px 0 3px;color:var(--navy);font-size:25px;line-height:1.25;letter-spacing:.045em;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:11px}
.nav{border-top:1px solid #f0f2f3;overflow:auto}
.navin{max-width:1180px;margin:auto;padding:0 22px;display:flex}
.nav button{position:relative;background:none;border:0;border-bottom:3px solid transparent;padding:12px 15px 11px;color:#62717a;white-space:nowrap;cursor:pointer;font:inherit;font-size:12px;transition:.2s}
.nav button:hover{color:var(--navy);background:#faf8f5}
.nav button.active{color:var(--navy);font-weight:800;border-bottom-color:var(--brick)}
.nav button.active:after{content:"";position:absolute;left:50%;bottom:-3px;width:18px;height:3px;transform:translateX(-50%);background:var(--brick)}

.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#8f3933 0%,#a84a3e 23%,#173e57 67%,#102f46 100%)}
.hero:before{
  content:"";position:absolute;inset:0;opacity:.13;
  background:
    repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.8) 19px 20px,transparent 21px 39px),
    linear-gradient(180deg,transparent 0 65%,rgba(0,0,0,.35) 100%);
}
.hero:after{
  content:"東京駅";position:absolute;right:5%;bottom:-42px;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:125px;font-weight:700;
  color:rgba(255,255,255,.065);letter-spacing:.08em;white-space:nowrap
}
.heroin{position:relative;z-index:1;max-width:1180px;margin:auto;padding:43px 22px 47px}
.heroin>div:first-child{display:flex;align-items:center;gap:10px;color:#f0d8a2;font-size:9px;letter-spacing:.24em;font-weight:800}
.heroin>div:first-child:before{content:"▰";font-size:9px;color:#f0d8a2}
.heroin>div:first-child:after{content:"";width:45px;height:1px;background:#f0d8a2;opacity:.7}
.hero h2{margin:10px 0 8px;font-size:32px;line-height:1.35;letter-spacing:.04em;font-weight:700}
.hero p{margin:0;color:#f3e9e5;font-size:12px;line-height:1.9}

.tools{max-width:1180px;margin:-25px auto 0;padding:0 22px;position:relative;z-index:3}
.search{display:flex;gap:8px;background:rgba(255,255,255,.98);border:1px solid #dbe2e5;border-radius:12px;padding:9px;box-shadow:0 14px 38px rgba(16,47,70,.13)}
.search:before{content:"東京駅";display:flex;align-items:center;padding:0 10px;color:var(--brick);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:11px;font-weight:700;border-right:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:#fafbfb;border-radius:8px;padding:13px 15px;font:inherit;font-size:13px;color:var(--ink)}
.search input::placeholder{color:#9aa5ab}
.search button{border:0;border-radius:8px;background:#edf1f2;color:#596a74;padding:0 18px;cursor:pointer;font:inherit;font-size:11px;transition:.2s}
.search button:hover{background:var(--navy);color:#fff}

main{max-width:1180px;margin:29px auto 70px;padding:0 22px}
.bar{display:flex;justify-content:space-between;align-items:end;margin:0 0 13px;padding:0 2px}
.bar h3{margin:0;color:var(--navy);font-size:19px;font-weight:800;letter-spacing:.03em}
.bar h3:before{content:"TOKYO";font-family:"Playfair Display",serif;color:var(--brick);font-size:10px;letter-spacing:.18em;margin-right:9px;vertical-align:2px}
.bar span{color:var(--muted);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 22px}
.cats button{border:1px solid #d7dfe2;background:#fff;border-radius:999px;padding:8px 16px;color:#5c6b74;cursor:pointer;font:inherit;font-size:11px;transition:.18s}
.cats button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,47,70,.07)}
.cats button.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(16,47,70,.16)}

.category{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:13px;margin-bottom:21px;overflow:hidden;box-shadow:var(--shadow)}
.category h4{position:relative;margin:0;padding:15px 19px 14px;background:linear-gradient(90deg,#f4eee6,#fafbfb);border-left:5px solid var(--brick);color:var(--navy);font-size:15px;font-weight:800;letter-spacing:.045em}
.category h4:before{content:"";display:inline-block;width:13px;height:13px;margin-right:9px;vertical-align:-2px;border:2px solid var(--brick);border-radius:50%}
.category h4:after{content:"";position:absolute;right:18px;top:50%;width:32px;height:1px;background:#d4dce0}
.grid{display:grid;grid-template-columns:1fr 1fr}
.shop{position:relative;padding:12px 16px 11px;min-height:57px;border-bottom:1px solid #edf0f1;transition:.18s}
.shop:nth-last-child(-n+2){border-bottom:0}
.shop:hover{background:#fbfaf8;padding-left:19px}
.shop a{color:#1c5878;text-decoration:none;font-size:13px;line-height:1.55;font-weight:600}
.shop a:hover{color:var(--brick)}
.shop a:after{content:"↗";display:inline-block;margin-left:5px;color:#9aa7ae;font-size:9px;transform:translateY(-1px)}
.meta{display:inline;font-size:9px;color:#8a969d;margin-left:9px;white-space:nowrap}
.facility{font-weight:700;color:#63727b}
.loc{margin-left:4px;color:#9aa4aa}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:2px;box-shadow:0 0 0 2px rgba(0,0,0,.025)}
.empty{background:#fff;border:1px solid var(--line);border-radius:12px;padding:50px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}

footer{position:relative;overflow:hidden;background:var(--navy);color:#bdcbd3;padding:30px 22px}
footer:before{content:"丸の内";position:absolute;left:5%;top:-35px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:110px;color:rgba(255,255,255,.035)}
footer:after{content:"TOKYO";position:absolute;right:5%;top:-45px;font-family:"Playfair Display",serif;font-size:145px;color:rgba(255,255,255,.035)}
.foot{position:relative;z-index:1;max-width:1180px;margin:auto;font-size:10px;line-height:2}
.foot b{color:#fff;font-size:12px;letter-spacing:.05em}

@media(max-width:700px){
 .head{padding:15px 14px 12px}.brand h1{font-size:20px}.brand p{font-size:10px}
 .navin{padding:0 7px}.nav button{padding:10px 10px;font-size:11px}
 .heroin{padding:31px 14px 36px}.hero h2{font-size:24px}.hero p{font-size:11px}.hero:after{font-size:70px;bottom:-10px}
 .tools{padding:0 14px;margin-top:-18px}.search{padding:7px}.search:before{display:none}.search input{padding:11px 12px;font-size:12px}.search button{padding:0 12px}
 main{padding:0 14px;margin-top:24px}.bar h3{font-size:17px}
 .grid{grid-template-columns:1fr}.shop{min-height:0;padding:11px 13px}.shop:hover{padding-left:13px}.shop:nth-last-child(-n+2){border-bottom:1px solid #edf0f1}.shop:last-child{border-bottom:0}
 .meta{display:block;margin:2px 0 0 13px;font-size:9px}.loc{margin-left:3px}.category h4{padding:13px 15px}
}

/* ===== TOKYO STATION IDENTITY ===== */
.hero{
  min-height:315px;
  background:
    linear-gradient(90deg,rgba(111,40,34,.97) 0%,rgba(130,49,41,.92) 33%,rgba(16,47,70,.92) 70%,rgba(10,38,56,.98) 100%);
}
.hero:before{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:155px;
  opacity:.32;
  background:
    /* 丸の内駅舎の屋根 */
    linear-gradient(155deg,transparent 0 34%,rgba(52,25,22,.85) 34.5% 35.5%,transparent 36%),
    linear-gradient(25deg,transparent 0 34%,rgba(52,25,22,.85) 34.5% 35.5%,transparent 36%),
    /* 赤レンガ壁 */
    repeating-linear-gradient(90deg,rgba(255,220,190,.75) 0 2px,transparent 2px 24px),
    repeating-linear-gradient(0deg,rgba(255,220,190,.55) 0 2px,transparent 2px 12px);
  background-size:520px 155px,520px 155px,520px 155px,520px 155px;
  background-position:center bottom;
  mask-image:linear-gradient(to top,black,transparent);
}
.hero:after{
  content:"東京駅";
  position:absolute;
  right:3%;
  bottom:-55px;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:175px;
  font-weight:800;
  letter-spacing:.12em;
  color:rgba(255,255,255,.10);
  white-space:nowrap;
}
.heroin{
  padding-top:52px;
  padding-bottom:72px;
}
.heroin:after{
  content:"TOKYO STATION";
  position:absolute;
  right:22px;
  bottom:22px;
  padding:8px 15px;
  border:1px solid rgba(255,255,255,.35);
  color:rgba(255,255,255,.85);
  font-family:"Playfair Display",serif;
  font-size:11px;
  letter-spacing:.25em;
  background:rgba(20,30,35,.18);
}
/* 駅舎の窓・ドームを象徴するカード */
.station-mark{
  position:absolute;
  right:55px;
  top:30px;
  width:235px;
  height:115px;
  border:2px solid rgba(238,211,166,.65);
  border-bottom:0;
  border-radius:120px 120px 0 0;
  opacity:.72;
}
.station-mark:before,
.station-mark:after{
  content:"";
  position:absolute;
  bottom:0;
  width:18px;
  height:82px;
  border-left:2px solid rgba(238,211,166,.55);
  border-right:2px solid rgba(238,211,166,.55);
}
.station-mark:before{left:38px}
.station-mark:after{right:38px}
.station-window{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:80px;
  height:52px;
  border:2px solid rgba(238,211,166,.55);
  border-radius:45px 45px 0 0;
}
.station-sign{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  padding:7px 13px;
  border:1px solid rgba(255,255,255,.48);
  background:rgba(17,35,44,.24);
  font-size:10px;
  letter-spacing:.12em;
}
.station-sign:before{
  content:"東京駅";
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  font-size:14px;
  font-weight:700;
}
.station-sign span{opacity:.85}

/* 東京駅駅名標風の帯 */
.nav:before{
  content:"東京駅  TOKYO STATION";
  display:block;
  max-width:1180px;
  margin:auto;
  padding:6px 22px 0;
  color:#8b3932;
  font-size:8px;
  font-weight:800;
  letter-spacing:.18em;
}

/* 見出しに駅名標風のアクセント */
.bar h3:before{
  content:"東京駅";
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
  color:#9b4038;
  font-size:12px;
  letter-spacing:.12em;
  margin-right:9px;
  vertical-align:1px;
}
@media(max-width:700px){
  .hero{min-height:270px}
  .hero:after{font-size:85px;bottom:-15px;right:-5px}
  .heroin{padding-top:34px;padding-bottom:65px}
  .heroin:after{right:14px;bottom:16px;font-size:9px}
  .station-mark{right:12px;top:22px;width:145px;height:70px}
  .station-mark:before,.station-mark:after{height:48px;width:12px}
  .station-mark:before{left:23px}.station-mark:after{right:23px}
  .station-window{width:48px;height:32px}
  .nav:before{padding-left:9px;font-size:7px}
}

/* ===== Functional design upgrades ===== */
.cats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin:0 0 24px;
}
.cats button{
  min-height:62px;
  border:1px solid #d7dfe2;
  border-radius:14px;
  background:linear-gradient(145deg,#fff,#f7f8f8);
  padding:11px 10px;
  color:#53636d;
  cursor:pointer;
  font:inherit;
  font-size:11px;
  font-weight:700;
  transition:.2s;
}
.cats button:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(16,47,70,.10)}
.cats button.active{background:linear-gradient(145deg,var(--navy),#244f68);border-color:var(--navy);color:#fff}

header{transition:box-shadow .25s}
.head{transition:padding .25s}
body.design-scrolled .head{padding-top:8px;padding-bottom:7px}
body.design-scrolled header{box-shadow:0 7px 24px rgba(16,47,70,.13)}
.search:focus-within{border-color:#9db0ba;box-shadow:0 14px 38px rgba(16,47,70,.17)}
@media(max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.cats{grid-template-columns:repeat(2,1fr)}}

</style>
<style>

  margin: 28px 0 34px;
  padding: 22px 20px 24px;

    linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,244,236,.96));

}

}

.rail-station.active .station-text b{color:#9e2b25}
.rail-station.food .station-dot{border-color:#9e2b25}
.rail-station.foods .station-dot{border-color:#b58a3b}
.rail-station.goods .station-dot{border-color:#4f687e}
.rail-station.fashion .station-dot{border-color:#687c62}
.rail-station.active.food .station-dot{background:#9e2b25}
.rail-station.active.foods .station-dot{background:#b58a3b}

.rail-station.active.fashion .station-dot{background:#687c62}
@media(max-width:720px){

    scrollbar-width:thin;
  }
  .railway-map:before{left:24px;right:24px;min-width:520px}

  from{opacity:0;transform:translateY(24px) scale(.98)}

  72%{opacity:1}

   let n=0;
   if(fields.includes(q)) n+=100;
   tokens.slice(1).forEach(t=>{if(t && fields.includes(t)) n+=25});
   return n;
 };
 const a=shops.filter(x=>(sf==="ALL"||x.facility===sf)&&(sc==="ALL"||x.displayCategory===sc)&&(!q||score(x)>0))
   .map((x,i)=>({x,s:score(x),i})).sort((a,b)=>b.s-a.s||a.i-b.i).map(o=>o.x);
 document.getElementById("count").textContent=a.length+"店舗";
 let out="";
 for(const cat of categories){
   const arr=a.filter(x=>x.displayCategory===cat); if(!arr.length) continue;
   out+='<section class="category"><h4>'+esc(cat)+'</h4><div class="grid">';
   for(const x of arr){
      const col=facilityColors[x.facility]||"#173b56";
      out+='<div class="shop"><span class="dot" style="background:'+col+'"></span><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a><span class="meta"><span class="facility">'+esc(facilityDetail[x.facility]||x.facility)+'</span><span class="loc">'+esc(x.location)+'</span></span></div>';
   }
   out+='</div></section>';
 }
 document.getElementById("content").innerHTML=out||'<div class="empty">条件に一致する店舗がありません。</div>';
}
setup();render();
</script>
<script>
(function(){
  const map = document.querySelector('.railway-map');
  if(!map) return;
  const stations = map.querySelectorAll('.rail-station');
  const existing = Array.from(document.querySelectorAll('button')).filter(b =>
    ['すべて','飲食','食品','キャラクター・グッズ','ファッション・雑貨・サービス'].includes(b.textContent.trim())
  );
  stations.forEach(station=>{
    station.addEventListener('click',()=>{
      const cat = station.dataset.category;
      stations.forEach(s=>{
        const on=s===station;
        s.classList.toggle('active',on);
        s.setAttribute('aria-selected',on?'true':'false');
      });
      const target = existing.find(b=>b.textContent.trim()=== (cat==='all'?'すべて':cat));
      if(target) target.click();
    });
  });
})();


  // Opening screen: tap/click to fade out immediately. No time-based auto close.
  document.getElementById('tokyoIntro')?.addEventListener('click', function(){
    this.classList.add('is-hidden');
  });
</script>
